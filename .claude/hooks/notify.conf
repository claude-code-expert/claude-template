# notify.conf — 알림 사운드·볼륨 설정. notify-mac.sh / notify-summary.sh 가 런타임에 읽는다.
# 이 파일 값을 바꾸면 다음 알림부터 바로 적용된다(claude 재시작 불필요).
# 볼륨: 0.0=음소거, 1.0=원음, 1.0 초과=증폭(예: 1.5). afplay -v 로 그 사운드만 스케일(시스템 볼륨 무관).
# 사운드: /System/Library/Sounds/*.aiff 중 택. 목록 → ls /System/Library/Sounds/

# 입력 필요(Notification 이벤트) — 크게
CLAUDE_NOTIFY_INPUT_SOUND=/System/Library/Sounds/Ping.aiff
CLAUDE_NOTIFY_INPUT_VOLUME=0.5

# 응답 완료(Stop 이벤트) — 작게
CLAUDE_NOTIFY_DONE_SOUND=/System/Library/Sounds/Glass.aiff
CLAUDE_NOTIFY_DONE_VOLUME=0.5
